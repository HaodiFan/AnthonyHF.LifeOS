version: 1
owner: Anthony Fan
visibility: public
purpose: Declare data sources before agents use them for memory, knowledge, or skill updates.
sources:
  memory_wiki:
    enabled: true
    config: identity/memories/wiki-repo.yml
    authority: configured
    token_policy: no-token-in-repo
    allowed_targets:
      - runtime/memory/working-lessons/
      - identity/memories/long-term/
      - capabilities/memory/distilled-knowledge/
    rule: Use the configured memory wiki for metabolism/inbox/query; AF-wiki is AnthonyHF's instance choice, not the openLifeOS default.
  github:
    enabled: false
    config: integrations/github.yml
    authority: repository-state
    token_policy: env-only-or-gh-auth
    allowed_targets:
      - identity/wenxin/skill-recommendations.yml
      - runtime/memory/working-lessons/
      - runtime/runtime-skills/
  github_runtime_skill_repos:
    enabled: true
    authority: external-runtime-skill-source
    token_policy: env-only-or-gh-auth
    allowed_targets:
      - runtime/runtime-skills/
      - runtime/sessions/
      - runtime/memory/working-lessons/
    repos:
      snapaf:
        repository: https://github.com/HaodiFan/snapAF-skills.git
        manifest: runtime/runtime-skills/snapaf/manifest.yml
  feishu:
    enabled: false
    config: integrations/feishu.yml
    authority: external-app
    token_policy: env-only
    allowed_targets:
      - runtime/memory/working-lessons/
      - identity/wenxin/
  hermes:
    enabled: false
    config: integrations/hermes.yml
    authority: imported-evidence
    token_policy: env-only-or-platform-secret
    allowed_targets:
      - runtime/memory/working-lessons/
      - identity/wenxin/skill-recommendations.yml
      - identity/psp/
  local_external_drive_afelite:
    enabled: true
    config: metabolism/processing/evidence-intake/external-drive-afelite-20260530.md
    authority: owner-local-evidence
    token_policy: no-token
    visibility: local-only-index
    body_policy: no-body-copy
    allowed_targets:
      - docs/evidence-sufficiency.md
      - identity/wenxin/
      - identity/psp/
      - identity/wenxin/skill-recommendations.yml
      - runtime/memory/working-lessons/
    forbidden_targets:
      - public raw file export
      - runtime prompt body injection
      - homepage assets without owner approval
public_export_gate:
  requires_owner_approval: true
  allowed:
    - approved facts
    - redacted summaries
    - abstracted patterns
  forbidden:
    - secrets
    - raw private bodies
    - unapproved personal records
