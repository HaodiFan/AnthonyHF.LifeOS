status: configured
update_policy: owner-reviewed
rule: 完整 self-evolution skills 安装在 skills/self-evolution/；默认通过 GitHub latest release archive 拉取为普通目录，不使用 submodule。更新必须先生成 diff，并由 owner 确认后再覆盖本地 Skill。
default_source:
  provider: github
  repo: "MetaInFlow/openLifeOS"
  ref: "latest"
  path: integrations/skill-sources/default-skills
skills:
  wenxin:
    local_path: skills/self-evolution/wenxin
    github_repo: "MetaInFLow/wenxin-skill"
    ref: latest
    update_mode: owner-reviewed-release-archive
  psp:
    local_path: skills/self-evolution/psp
    github_repo: "MetaInFLow/psp-skill"
    ref: latest
    update_mode: owner-reviewed-release-archive
  ipo-reverse:
    local_path: skills/self-evolution/ipo-reverse
    github_repo: "MetaInFLow/ipo-reverse-skill"
    ref: latest
    update_mode: owner-reviewed-release-archive
