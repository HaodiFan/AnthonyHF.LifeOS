schema: openlifeos.lifecycle-status.v1
repo: AnthonyHF.LifeOS
owner: Anthony Fan
created_at: "2026-04-02T00:00:00+08:00"
updated_at: "2026-06-02T00:00:00+08:00"
lifecycle:
  mode: development
  meaning:
    development: "AnthonyHF authoring state. Meta skills may be connected as submodules or editable working sources so Anthony can iterate and upload versions."
    delivery: "AnthonyHF consumable state. Meta skills should be resolved from latest approved release archives and recorded as vendored source snapshots."
versions:
  upload_version: anthonyhf-lifeos-upload-20260531
  delivery_version: anthonyhf-lifeos-delivery-unreleased
  current_version: anthonyhf-lifeos-upload-20260531
source_policy:
  meta_skills:
    development:
      install_mode: submodule-or-working-source
      uploadable: true
      active_sources:
        - id: engineering-everything
          canonical: capabilities/engineering-everything/SKILL.md
          summary: identity/wenxin/skill-summaries/engineering-everything.md
          source_mode: submodule
          upload_target: https://github.com/HaodiFan/engineering-everything.git
      rule: "Development mode keeps meta skills editable so Anthony can change, review, and upload upstream versions."
    delivery:
      install_mode: github-release-archive
      uploadable: false
      target_sources:
        - id: engineering-everything
          canonical: capabilities/engineering-everything/SKILL.md
          summary: identity/wenxin/skill-summaries/engineering-everything.md
          source_mode: release-archive
          release_source: https://github.com/HaodiFan/engineering-everything/releases/latest
      rule: "Delivery mode should replace mutable meta skill working sources with latest approved release archives."
  self_evolution_skills:
    current_install_mode: github-release-archive
    rule: "Wenxin, PSP, and IPO Reverse are already vendored from release archives; Cognitive Alignment remains a development source until release packaging is configured."
runtime_projection:
  current_state: generated-from-development-lifeos
  rule: "OpenClaw and Hermes projections must record that they were generated from the current LifeOS lifecycle state."
release_gate:
  before_delivery:
    - validate_avatar_repo
    - openlifeos_progress
    - confirm_private_material_excluded
    - resolve_meta_skill_sources_to_release_archive
    - regenerate_openclaw_profile
    - regenerate_hermes_profile
lifeos_schema: v2
schema_revision: 0003_lifeos_schema_v2_refine_living_fs
