source_repo: "https://github.com/HaodiFan/AnthonyHF.Skill"
target_repo_name: "AnthonyHF.LifeOS"
import_target: "output/meta/AnthonyHF.LifeOS"
strategy: "additive_migration_no_information_loss"
structural_moves:
  - from: "src/"
    to: "apps/homepage/src/"
    reason: "Keep repo root as canonical LifeOS kernel while preserving the original Vite homepage."
  - from: "components/"
    to: "apps/homepage/components/"
    reason: "Keep frontend UI components inside the public surface app."
  - from: "lib/"
    to: "apps/homepage/lib/"
    reason: "Keep homepage helper code colocated with the app."
  - from: "public/"
    to: "apps/homepage/public/"
    reason: "Keep homepage static assets inside the public surface app."
  - from: "index.html"
    to: "apps/homepage/index.html"
    reason: "Vite app entrypoint belongs to the homepage delivery target."
  - from: "package.json"
    to: "apps/homepage/package.json"
    reason: "Frontend dependencies belong to the homepage delivery target."
  - from: "package-lock.json"
    to: "apps/homepage/package-lock.json"
    reason: "Frontend dependency lockfile belongs to the homepage delivery target."
  - from: "vite.config.ts"
    to: "apps/homepage/vite.config.ts"
    reason: "Frontend build configuration belongs to the homepage delivery target."
  - from: "tsconfig*.json"
    to: "apps/homepage/tsconfig*.json"
    reason: "Frontend TypeScript configuration belongs to the homepage delivery target."
  - from: "components.json"
    to: "apps/homepage/components.json"
    reason: "shadcn-compatible component registry belongs to the homepage delivery target."
  - from: "DESIGN.md"
    to: "apps/homepage/DESIGN.md"
    reason: "Homepage design system belongs to the homepage delivery target."
