    <path d="M268 117C291 132 333 132 356 117" stroke="url(#matrixGradient)" stroke-width="17" stroke-linecap="round"/>
    <circle cx="294" cy="61" r="5" fill="#FFF4D6"/>
    <circle cx="327" cy="77" r="5" fill="#D9EEFF"/>
    <circle cx="366" cy="63" r="5" fill="#FFF4D6"/>
    <circle cx="286" cy="128" r="5" fill="#D9EEFF"/>
    <circle cx="346" cy="127" r="5" fill="#FFF4D6"/>
