    <circle cx="145" cy="35" r="8" fill="#5DDE72"/>
    <circle cx="158" cy="70" r="7" fill="#58B8FF"/>
    <circle cx="112" cy="18" r="6" fill="#7C3AED"/>
  </g>

  <rect x="48" y="65" width="106" height="80" rx="24" fill="url(#cardGradient)" filter="url(#softShadow)"/>
  <circle cx="82" cy="102" r="17" fill="#2A1242"/>
  <circle cx="121" cy="102" r="17" fill="#3A2315"/>
  <path d="M91 126C99 136 113 136 121 126" stroke="white" stroke-width="8" stroke-linecap="round"/>
  <path d="M98 92H107V113" stroke="#FFF6EA" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M204 34L174 146" stroke="#D8DCE2" stroke-width="5" stroke-linecap="round"/>

