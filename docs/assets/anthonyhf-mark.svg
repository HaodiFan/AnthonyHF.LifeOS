<svg width="420" height="180" viewBox="0 0 420 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AnthonyHF.Skill mark</title>
  <desc id="desc">A warm personal digital twin mark combining an HF core and a skill matrix loop.</desc>
  <defs>
    <radialGradient id="coreGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(98 72) rotate(48) scale(83 80)">
      <stop stop-color="#FFD9A8"/>
      <stop offset="0.48" stop-color="#FF8FA3"/>
      <stop offset="1" stop-color="#6D5DF6"/>
    </radialGradient>
    <linearGradient id="cardGradient" x1="40" y1="36" x2="156" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF4E7"/>
      <stop offset="0.52" stop-color="#FFB56B"/>
      <stop offset="1" stop-color="#FF7A90"/>
    </linearGradient>
    <linearGradient id="matrixGradient" x1="248" y1="55" x2="356" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD36E"/>
      <stop offset="0.42" stop-color="#FF9F45"/>
      <stop offset="1" stop-color="#EF6A73"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#7A3B22" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <path d="M70 32C82 9 119 6 134 27C156 27 171 47 164 68C180 84 170 112 147 114H70C44 114 31 84 49 66C42 51 52 35 70 32Z" fill="url(#coreGlow)" opacity="0.92"/>
