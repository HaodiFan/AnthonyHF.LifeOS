<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="980" viewBox="0 0 1320 980" role="img" aria-labelledby="title desc">
  <title id="title">AnthonyHF.Skill 数字分身结构树</title>
  <desc id="desc">以树状结构展示 AnthonyHF.Skill 的身份层、能力层、记忆层和安全边界。</desc>
  <defs>
    <linearGradient id="rootGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#17324D"/>
      <stop offset="100%" stop-color="#2F6B7E"/>
    </linearGradient>
    <linearGradient id="identityGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#FFF7D6"/>
      <stop offset="100%" stop-color="#FFE3A3"/>
    </linearGradient>
    <linearGradient id="skillGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#E9F7EF"/>
      <stop offset="100%" stop-color="#BFE6D2"/>
    </linearGradient>
    <linearGradient id="memoryGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#EAF1FF"/>
      <stop offset="100%" stop-color="#C8D8FF"/>
    </linearGradient>
    <linearGradient id="privateGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#FFF0F0"/>
      <stop offset="100%" stop-color="#FFD2D2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #FBFAF7; }
      .root-title { font: 700 30px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #FFFFFF; }
      .root-sub { font: 500 17px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #DDEBF0; }
      .layer-title { font: 700 22px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1F2937; }
      .node-title { font: 700 17px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1F2937; }
      .node-text { font: 500 14px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #374151; }
      .note { font: 500 13px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6B7280; }
      .line { fill: none; stroke: #476170; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .soft-line { fill: none; stroke: #8A9AA6; stroke-width: 2; stroke-dasharray: 7 8; stroke-linecap: round; }
      .leaf { fill: #FFFFFF; stroke: #D7DEE8; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="bg" width="1320" height="980" rx="28"/>
  <text x="660" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#1F2937">AnthonyHF.Skill 数字分身结构树</text>
  <text x="660" y="82" text-anchor="middle" class="note">水面上是别人能看到的身份；水面下是能力、记忆和持续进化系统。</text>

  <rect x="425" y="120" width="470" height="112" rx="24" fill="url(#rootGrad)" filter="url(#shadow)"/>
  <text x="660" y="164" text-anchor="middle" class="root-title">AnthonyHF.Skill</text>
  <text x="660" y="195" text-anchor="middle" class="root-sub">个人数字分身总入口 · 路线指引 · 安全边界</text>

  <path class="line" d="M660 232 C660 275 660 285 660 320"/>
  <path class="line" d="M660 320 C320 320 210 345 210 390"/>
  <path class="line" d="M660 320 C535 330 470 350 470 390"/>
  <path class="line" d="M660 320 C785 330 850 350 850 390"/>
  <path class="soft-line" d="M660 320 C1040 320 1110 350 1110 390"/>

  <g filter="url(#shadow)">
    <rect x="70" y="390" width="280" height="78" rx="20" fill="url(#identityGrad)"/>
    <text x="210" y="424" text-anchor="middle" class="layer-title">Identity 身份层</text>
    <text x="210" y="448" text-anchor="middle" class="node-text">我是谁 · 对外如何被理解</text>

    <rect x="330" y="390" width="280" height="78" rx="20" fill="url(#skillGrad)"/>
    <text x="470" y="424" text-anchor="middle" class="layer-title">Skills 能力层</text>
    <text x="470" y="448" text-anchor="middle" class="node-text">我能替 Anthony 做什么</text>

    <rect x="710" y="390" width="280" height="78" rx="20" fill="url(#memoryGrad)"/>
    <text x="850" y="424" text-anchor="middle" class="layer-title">AF-wiki 记忆层</text>
    <text x="850" y="448" text-anchor="middle" class="node-text">我如何基于真实资料进化</text>

    <rect x="1010" y="390" width="250" height="78" rx="20" fill="url(#privateGrad)"/>
    <text x="1135" y="424" text-anchor="middle" class="layer-title">安全边界</text>
    <text x="1135" y="448" text-anchor="middle" class="node-text">不进入公开仓库</text>
  </g>

  <path class="line" d="M210 468 L210 520"/>
  <path class="line" d="M470 468 L470 520"/>
  <path class="line" d="M850 468 L850 520"/>
  <path class="soft-line" d="M1135 468 L1135 520"/>

  <g>
    <rect class="leaf" x="40" y="520" width="340" height="92" rx="16"/>
    <text x="210" y="553" text-anchor="middle" class="node-title">问心报告：对外定位</text>
    <text x="210" y="579" text-anchor="middle" class="node-text">29 岁 20 年码龄的超级工程师</text>
    <text x="210" y="600" text-anchor="middle" class="note">用于 README 展示、履历和自我介绍</text>

    <rect class="leaf" x="40" y="636" width="340" height="92" rx="16"/>
    <text x="210" y="669" text-anchor="middle" class="node-title">PSP：分身描述</text>
    <text x="210" y="695" text-anchor="middle" class="node-text">判断方式、边界、行为倾向</text>
    <text x="210" y="716" text-anchor="middle" class="note">当前仍在搭框架阶段</text>

    <rect class="leaf" x="40" y="752" width="340" height="92" rx="16"/>
    <text x="210" y="785" text-anchor="middle" class="node-title">公开身份配置</text>
    <text x="210" y="811" text-anchor="middle" class="node-text">GitHub、主页、公开联系方式</text>
    <text x="210" y="832" text-anchor="middle" class="note">只放可公开的信息</text>
  </g>

  <g>
    <rect class="leaf" x="300" y="520" width="340" height="92" rx="16"/>
    <text x="470" y="553" text-anchor="middle" class="node-title">工作型 Skill</text>
    <text x="470" y="579" text-anchor="middle" class="node-text">写报告、写代码、做项目、复盘</text>
    <text x="470" y="600" text-anchor="middle" class="note">把想法变成可交付成果</text>

    <rect class="leaf" x="300" y="636" width="340" height="92" rx="16"/>
    <text x="470" y="669" text-anchor="middle" class="node-title">认知型 Skill</text>
    <text x="470" y="695" text-anchor="middle" class="node-text">培训、判断、方法论、组织经验</text>
    <text x="470" y="716" text-anchor="middle" class="note">沉淀 Anthony 的思考方式</text>

    <rect class="leaf" x="300" y="752" width="340" height="92" rx="16"/>
    <text x="470" y="785" text-anchor="middle" class="node-title">Engineering Everything</text>
    <text x="470" y="811" text-anchor="middle" class="node-text">工程化判断、阶段路由、验证门禁</text>
    <text x="470" y="832" text-anchor="middle" class="note">当前已接入的核心方法论</text>
  </g>

  <g>
    <rect class="leaf" x="680" y="520" width="340" height="92" rx="16"/>
    <text x="850" y="553" text-anchor="middle" class="node-title">工作上下文</text>
    <text x="850" y="579" text-anchor="middle" class="node-text">项目、客户、计划、复盘</text>
    <text x="850" y="600" text-anchor="middle" class="note">让分身知道当下在做什么</text>

    <rect class="leaf" x="680" y="636" width="340" height="92" rx="16"/>
    <text x="850" y="669" text-anchor="middle" class="node-title">生活与身体数据</text>
    <text x="850" y="695" text-anchor="middle" class="node-text">健身、习惯、能量、长期状态</text>
    <text x="850" y="716" text-anchor="middle" class="note">让分身理解人的现实约束</text>

    <rect class="leaf" x="680" y="752" width="340" height="92" rx="16"/>
    <text x="850" y="785" text-anchor="middle" class="node-title">知识与研究库</text>
    <text x="850" y="811" text-anchor="middle" class="node-text">阅读、研究、资料、历史变化</text>
    <text x="850" y="832" text-anchor="middle" class="note">让分身持续学习和演化</text>
  </g>

  <g>
    <rect class="leaf" x="1030" y="520" width="220" height="92" rx="16" stroke="#F2A7A7"/>
    <text x="1140" y="553" text-anchor="middle" class="node-title">敏感配置</text>
    <text x="1140" y="579" text-anchor="middle" class="node-text">密码 / Token / API Key</text>
    <text x="1140" y="600" text-anchor="middle" class="note">只在安全管理器保存</text>

    <rect class="leaf" x="1030" y="636" width="220" height="92" rx="16" stroke="#F2A7A7"/>
    <text x="1140" y="669" text-anchor="middle" class="node-title">私人材料</text>
    <text x="1140" y="695" text-anchor="middle" class="node-text">证件、合同、聊天记录</text>
    <text x="1140" y="716" text-anchor="middle" class="note">默认不公开</text>
  </g>

  <text x="660" y="920" text-anchor="middle" class="note">公开仓库只保存可公开、可验证、可被复用的部分；敏感配置永远不入库。</text>
</svg>
