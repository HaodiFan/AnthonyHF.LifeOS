<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080" role="img" aria-labelledby="title desc">
  <title id="title">AnthonyHF.Skill repo 架构冰山图</title>
  <desc id="desc">用冰山方式解释 AnthonyHF.Skill 公开仓库的目录架构。水面上是 README、SKILL、matrix 等入口文件；水面下是 identity、skills、memory、security 和 docs 五个核心目录。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#F7FAFC"/>
      <stop offset="0.46" stop-color="#E9F4F7"/>
      <stop offset="1" stop-color="#D6E8EF"/>
    </linearGradient>
    <linearGradient id="water" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#CDEBF2"/>
      <stop offset="0.5" stop-color="#84BAC9"/>
      <stop offset="1" stop-color="#1E4B60"/>
    </linearGradient>
    <linearGradient id="iceTop" x1="0.08" x2="0.92" y1="0.04" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.58" stop-color="#DCEEF3"/>
      <stop offset="1" stop-color="#9EC5D4"/>
    </linearGradient>
    <linearGradient id="iceDeep" x1="0.18" x2="0.88" y1="0.05" y2="1">
      <stop offset="0" stop-color="#DDF3F8" stop-opacity="0.98"/>
      <stop offset="0.48" stop-color="#7DB9CA" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#285F75" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="entry" x1="0" x2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8F5F8"/>
    </linearGradient>
    <linearGradient id="identity" x1="0" x2="1">
      <stop offset="0" stop-color="#FFE7A5"/>
      <stop offset="1" stop-color="#F8C56D"/>
    </linearGradient>
    <linearGradient id="skills" x1="0" x2="1">
      <stop offset="0" stop-color="#BDE6FF"/>
      <stop offset="1" stop-color="#74B9D7"/>
    </linearGradient>
    <linearGradient id="memory" x1="0" x2="1">
      <stop offset="0" stop-color="#CBEED9"/>
      <stop offset="1" stop-color="#76C396"/>
    </linearGradient>
    <linearGradient id="security" x1="0" x2="1">
      <stop offset="0" stop-color="#FFD8C7"/>
      <stop offset="1" stop-color="#F39B7C"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#113342" flood-opacity="0.24"/>
    </filter>
    <filter id="cardShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#173342" flood-opacity="0.16"/>
    </filter>
    <clipPath id="iceClip">
      <path d="M368 422 C456 386 563 374 660 392 L720 146 C732 98 797 92 819 136 L958 392 C1048 378 1160 389 1248 422 L1034 812 C944 976 838 1035 724 1024 C609 1014 514 921 438 765 Z"/>
    </clipPath>
    <pattern id="iceGrain" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M1 8 H27 M5 21 H22" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1"/>
    </pattern>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; }
      .kicker { font-size: 18px; font-weight: 760; fill: #49646D; }
      .title { font-size: 38px; font-weight: 860; fill: #14303E; }
      .subtitle { font-size: 18px; fill: #49646D; }
      .section { font-size: 24px; font-weight: 840; fill: #163544; }
      .cardTitle { font-size: 21px; font-weight: 840; fill: #163544; }
      .smallTitle { font-size: 17px; font-weight: 800; fill: #163544; }
      .body { font-size: 15px; fill: #33515D; }
      .body2 { font-size: 14px; fill: #48636D; }
      .light { font-size: 15px; fill: #ECF8FA; }
      .lightTitle { font-size: 22px; font-weight: 840; fill: #FFFFFF; }
      .file { font-size: 15px; font-weight: 800; fill: #173544; }
      .chip { font-size: 13px; font-weight: 800; fill: #173544; }
      .muted { font-size: 13px; fill: #657D85; }
      .mono { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 14px; fill: #1A3948; font-weight: 700; }
    </style>
  </defs>

  <rect width="1500" height="1080" fill="url(#bg)"/>
  <rect y="404" width="1500" height="676" fill="url(#water)"/>
  <path d="M0 410 C183 386 326 438 496 409 C652 382 800 384 962 409 C1132 436 1294 386 1500 410 L1500 462 C1294 438 1132 488 962 460 C800 433 652 432 496 460 C326 488 183 438 0 462 Z" fill="#F8FCFD" opacity="0.76"/>
  <path d="M0 438 C183 414 326 459 496 435 C652 412 800 412 962 435 C1132 459 1294 414 1500 438" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.7"/>

  <g class="font">
    <text x="86" y="78" class="kicker">AnthonyHF.Skill</text>
    <text x="86" y="124" class="title">repo 架构一眼看懂</text>
    <text x="86" y="160" class="subtitle">这是一个公开的个人数字分身入口仓库：上面是入口说明，下面是身份、能力、记忆和安全边界。</text>
  </g>

  <g filter="url(#shadow)">
    <path d="M720 146 C732 98 797 92 819 136 L958 392 C860 409 753 410 660 392 Z" fill="url(#iceTop)"/>
    <path d="M368 422 C456 386 563 374 660 392 L720 146 C732 98 797 92 819 136 L958 392 C1048 378 1160 389 1248 422 L1034 812 C944 976 838 1035 724 1024 C609 1014 514 921 438 765 Z" fill="url(#iceDeep)"/>
    <rect x="330" y="404" width="936" height="34" fill="#F9FCFD" opacity="0.82"/>
    <rect x="360" y="410" width="900" height="600" clip-path="url(#iceClip)" fill="url(#iceGrain)" opacity="0.72"/>
  </g>

  <g class="font" filter="url(#cardShadow)">
    <rect x="509" y="222" width="492" height="142" rx="22" fill="url(#entry)" opacity="0.95"/>
    <text x="755" y="259" text-anchor="middle" class="cardTitle">repo 顶部入口</text>
    <text x="755" y="292" text-anchor="middle" class="body">普通人先看 README；AI 先读 SKILL；机器读 matrix。</text>
    <g>
      <rect x="552" y="314" width="116" height="32" rx="16" fill="#FFFFFF"/>
      <text x="610" y="335" text-anchor="middle" class="file">README.md</text>
      <rect x="696" y="314" width="98" height="32" rx="16" fill="#FFFFFF"/>
      <text x="745" y="335" text-anchor="middle" class="file">SKILL.md</text>
      <rect x="822" y="314" width="126" height="32" rx="16" fill="#FFFFFF"/>
      <text x="885" y="335" text-anchor="middle" class="file">matrix.yml</text>
    </g>
  </g>

  <g class="font">
    <text x="92" y="379" class="section">水面上</text>
    <text x="92" y="410" class="body">访问 GitHub 首页时首先看到的说明层。</text>
    <text x="1325" y="379" text-anchor="end" class="section">水线</text>
    <text x="1325" y="410" text-anchor="end" class="body">公开 repo 的展示面与内部目录的分界。</text>
  </g>

  <g class="font" clip-path="url(#iceClip)">
    <rect x="445" y="468" width="630" height="126" rx="22" fill="url(#identity)" opacity="0.97"/>
    <text x="482" y="508" class="cardTitle">identity/ 身份层</text>
    <text x="482" y="538" class="body">回答“Anthony 是谁”，放公开身份、问心报告和 PSP 分身协议。</text>
    <text x="482" y="568" class="body">问心.skill -> 问心报告；PSP.skill -> PSP 分身描述。</text>

    <rect x="397" y="632" width="744" height="236" rx="28" fill="url(#skills)" opacity="0.95"/>
    <text x="437" y="676" class="cardTitle">skills/ 能力层</text>
    <text x="437" y="705" class="body">回答“这个分身能做什么”。这里放具体 Skill，不放所有人生材料。</text>

    <rect x="438" y="732" width="198" height="72" rx="15" fill="#FFFFFF" opacity="0.86"/>
    <text x="537" y="760" text-anchor="middle" class="smallTitle">工作型 Skill</text>
    <text x="537" y="786" text-anchor="middle" class="body2">写报告 / 写代码 / 复盘</text>

    <rect x="659" y="732" width="278" height="72" rx="15" fill="#FFFFFF" opacity="0.9"/>
    <text x="798" y="759" text-anchor="middle" class="smallTitle">认知型 Skill 模块</text>
    <text x="798" y="786" text-anchor="middle" class="body2">工程判断 / 培训 / 组织运营</text>

    <rect x="675" y="814" width="342" height="46" rx="23" fill="#163544" opacity="0.92"/>
    <text x="846" y="843" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="850">engineering-everything = CTO 岗具体 Skill submodule</text>

    <rect x="955" y="732" width="184" height="72" rx="15" fill="#FFFFFF" opacity="0.5" stroke="#FFFFFF" stroke-dasharray="7 7"/>
    <text x="1047" y="760" text-anchor="middle" class="smallTitle">未来 Skill</text>
    <text x="1047" y="786" text-anchor="middle" class="body2">公司运营 / 管理认知</text>

    <rect x="474" y="894" width="492" height="98" rx="24" fill="url(#memory)" opacity="0.97"/>
    <text x="516" y="936" class="cardTitle">memory/ 记忆层</text>
    <text x="516" y="966" class="body">AF-wiki submodule：工作、生活、知识、项目、复盘的长期资料库。</text>
  </g>

  <g class="font">
    <g filter="url(#cardShadow)">
      <rect x="88" y="522" width="292" height="206" rx="24" fill="#FFFFFF" opacity="0.92"/>
      <text x="124" y="566" class="cardTitle">docs/ 展示层</text>
      <text x="124" y="598" class="body">放图和解释材料。</text>
      <text x="124" y="628" class="body">它帮助人理解 repo，</text>
      <text x="124" y="656" class="body">但不是真相源。</text>
      <rect x="124" y="681" width="166" height="32" rx="16" fill="#E8F5F8"/>
      <text x="207" y="702" text-anchor="middle" class="mono">docs/assets/</text>
    </g>

    <g filter="url(#cardShadow)">
      <rect x="1136" y="506" width="284" height="236" rx="24" fill="url(#security)" opacity="0.96"/>
      <text x="1174" y="550" class="cardTitle">security/ 安全边界</text>
      <text x="1174" y="584" class="body">公开 repo 绝不放：</text>
      <text x="1174" y="616" class="body">账号密码、Token、API Key</text>
      <text x="1174" y="646" class="body">私密合同、证件、聊天记录</text>
      <text x="1174" y="694" class="body">它定义什么可以公开，</text>
      <text x="1174" y="722" class="body">什么只能留在私域。</text>
    </g>
  </g>

  <g class="font">
    <text x="94" y="828" class="lightTitle">读图顺序</text>
    <text x="94" y="862" class="light">1. 先看 repo 顶部入口：README / SKILL / matrix。</text>
    <text x="94" y="892" class="light">2. 再看水下三层：identity、skills、memory。</text>
    <text x="94" y="922" class="light">3. 最后看 docs 和 security：一个负责展示，一个负责边界。</text>
  </g>

  <g class="font">
    <rect x="1124" y="816" width="286" height="118" rx="22" fill="#FFFFFF" opacity="0.16" stroke="#FFFFFF" stroke-opacity="0.45"/>
    <text x="1160" y="854" class="lightTitle">外部来源</text>
    <text x="1160" y="884" class="light">Wenxin Skill 不作为 submodule。</text>
    <text x="1160" y="912" class="light">它只把报告产物放进 identity/。</text>
  </g>
</svg>
