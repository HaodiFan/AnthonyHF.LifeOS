name: AnthonyHF.Skill
owner: Anthony Fan
positioning: Anthony Fan 的个人数字分身、公开身份、工程师分身与工作/生活上下文入口
language: zh-CN-first
root_skill:
  id: anthonyhf
  path: .
  entrypoint: SKILL.md
layers:
  identity:
    path: identity/
    purpose: 我是谁、如何被理解、分身协议。
  skills:
    path: skills/
    purpose: 数字分身能替 Anthony 做什么。
  memory:
    path: memory/
    purpose: 工作、生活、知识、项目和历史变化的长期资料库。
  security:
    path: security/
    purpose: 公开仓库的安全边界和禁入内容。
  docs:
    path: docs/
    purpose: 面向人类读者的结构图和说明材料。
identity:
  public_positioning:
    source: 问心 Skill
    repository: https://github.com/HaodiFan/wenxin-skill
    artifact: identity/wenxin/wenxin-report-continuous-founder-ascetic.pdf
    role: 对外定位、个人履历、个人 BP 和 README 展示内容。
  structure_visual:
    artifact: docs/assets/anthonyhf-readme-cover.png
    role: README 顶部的个人数字分身接口封面图，用普通人能理解的方式展示入口文件、Anthony.HF Core、模块名与当前实例的区别、Identity/Skills/Memory-Wiki 三个核心模块、问心报告/PSP/engineering-everything/AF-wiki 当前实例、展示层、安全边界和底层运行组件。
person_models:
  - id: anthony-fan
    path: identity/psp/anthony-fan/PSP.md
    status: v0.3 feishu-meeting-enriched scaffold
    scope: 当前公开身份画像、工程师身份切片、工作会议风格、产品/GTM 判断、AI Agent 认知偏好、正式写作风格参考与工作/生活上下文路由；PSP 方法产出物，属于 Identity 层的分身描述。已吸收 Feishu 妙记私有蒸馏结论，但仍不可作为完整真人复刻。
submodules:
  skills:
    - id: engineering-everything
      name: Engineering Everything
      path: skills/engineering-everything
      entrypoint: skills/engineering-everything/engineering-everything/SKILL.md
      repository: https://github.com/HaodiFan/engineering-everything.git
      role: CTO 岗位相关的具体认知/执行 Skill，用于工程判断、项目执行、架构、SOP、AI/Agent workflow 与验证门禁。
  memory:
    - id: af-wiki
      name: AF-wiki
      path: memory/af-wiki
      repository: https://github.com/HaodiFan/AF-wiki.git
      role: Anthony 工作/生活 second brain，是长期事实、记忆和 area 上下文的真相源。
excluded:
  - id: wenxin-skill
    reason: Wenxin 属于个人定位、自我认知和个人 BP 工作流，故意不放入 AnthonyHF.Skill。
